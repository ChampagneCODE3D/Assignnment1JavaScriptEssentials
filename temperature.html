  <main class="container">
    <section class="card">
      <h2>Temperature Converter</h2>
      <p>Select the input unit, enter a value, and conversion to the other units happens automatically.</p>
      <!-- Rankine is included as an optional extension inspired by thermodynamics studies at SAIT. -->

      <div class="form-grid">
        <label for="input-unit">Input unit</label>
        <select id="input-unit">
          <option value="fahrenheit">Fahrenheit</option>
          <option value="celsius">Celsius</option>
          <option value="kelvin">Kelvin</option>
          <option value="rankine">Rankine</option>
        </select>

        <label for="temperature-input">Input value</label>
        <input id="temperature-input" type="number" step="any" placeholder="Enter temperature">
      </div>

      <div class="form-grid output-grid">
        <label for="fahrenheit-output">Fahrenheit (F)</label>
        <input id="fahrenheit-output" type="text" readonly>

        <label for="celsius-output">Celsius (C)</label>
        <input id="celsius-output" type="text" readonly>

        <label for="kelvin-output">Kelvin (K)</label>
        <input id="kelvin-output" type="text" readonly>

        <label for="rankine-output">Rankine (R)</label>
        <input id="rankine-output" type="text" readonly>
      </div>

      <p id="temperature-message" class="status-message" aria-live="polite"></p>
    </section>
  </main>

  <footer class="site-footer">
